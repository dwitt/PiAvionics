# =============================================================================
# Engine data conversions: RDAC XF raw values to engineering units.
#
# One table for both displays. The EFIS (Python) and the backup display (C++) each follow it, so a
# change is made here first. Reference implementation: Protocol/engine_convert.py (VERSION 1.0.1; the thresholds below are not used by it yet).
# RDAC frames are in Protocol/mgl_can_messages.yaml (types 2 to 8; ID = 0x200 + type for address 32).
#
# status: checked = compared with the real sender or bench readings; fitted = built from published points,
#         to be checked on the engine; pending = needs a decision or a calibration before it gives a number.
# =============================================================================

version: "1.1.1"

timeouts:
  # The RDAC sends no heartbeat, status or version (MGL CAN protocol), so a lost RDAC shows only as frames that stop.
  # A value is treated as lost when its frame is older than this (seconds, about three periods).
  rdac_lost: {frame: 0x208, seconds: 1.0, note: "the fastest frame (200 ms). When it is older than this the RDAC is lost and EVERY engine value is shown as failed"}
  frames:
    0x208: 1.0     # rpm, current
    0x202: 1.5     # thermocouples 1 to 4
    0x203: 1.5     # thermocouples 5 to 8
    0x205: 1.5     # oil temperature, oil pressure, aux
    0x207: 1.5     # cold junction (needed by every thermocouple) and supply volts
  also_failed: "an open input (raw at the full scale, 3908) or a shorted input (raw near 0) is a failed sender, not a reading"
  status: fitted

resistive_input:
  # The RDAC pulls the input up to its supply through a resistor and reads the divider. OILP 1000 ohm,
  # OILT 1500 ohm (fixed), AUX1 and AUX2 1500 ohm (switch on). With the input open the RDAC reads 3908
  # (the full scale of the divider), so  R = pullup * raw / (full_scale - raw).
  full_scale: 3908
  pullup_ohm: {oil_pressure: 1000, oil_temp: 1500, aux1: 1500, aux2: 1500}
  status: checked
  check: >
    Bench 2026-10-25 with a 120 ohm resistor: OILP raw 428 (R 119.8 using the measured 973 ohm pull-up),
    OILT raw 297 (R 120.1 using the measured 1460 ohm pull-up).

oil_pressure:
  from: oil_pressure          # RDAC_ANALOG_1 bytes 2-3
  sender: >
    VDO 5 bar, characteristic curve table III (vdo_pressure_sensors.pdf, TU00-0774-7104620). David's sender is VDO 360-001
    (Sonex ACV-P01-76), marked "80 PS", read as 80 psi. VDO pairs 80 psi with the 5 bar curve and 150 psi with 10 bar, so this is
    the 5 bar curve (72.5 psi). Not tested against a known pressure.
  # Resistance in ohm from pressure in bar:  R = a*p^2 + b*p + c  (nominal curve). Invert for pressure.
  quadratic: {a: -0.3682, b: 36.465, c: 10.648}
  range_bar: [0, 5]
  below_range: "resistance under 10.6 ohm: show 0 bar. Above the 5 bar resistance (about 184 ohm) or an open input: sender fault"
  unit: bar
  status: checked
  check: "120 ohm gives 3.1 bar, the same as the Blaze (45 psi) on 2026-10-25"

oil_temp:
  from: oil_temp              # RDAC_ANALOG_1 bytes 0-1
  sender: >
    VDO 150 degC (300 F) NTC thermistor. David's sender is VDO 323-055 (Sonex ACV-P01-77), marked 300F. The 300 F senders
    (323-055 and 323-057, which differ in thread) are listed at 18 to 322 ohm. VDO curve type 2, 36.5 ohm at 120 degC.
  # Steinhart-Hart through (322.8 ohm, 50 degC), (36.5, 120) and (18.6, 150):
  #   1/T = A + B*ln(R) + C*ln(R)^3   (T in kelvin)
  steinhart_hart: {A: 0.0015525513345798962, B: 0.00028091203795547765, C: -4.1934592032947954e-07}
  points: [[322.8, 50], [36.5, 120], [18.6, 150]]
  range_degC: [40, 160]
  unit: degC
  status: fitted
  note: >
    The 120 degC point is from the VDO datasheet (TU00-0770-5104620). The 50 and 150 degC points are from a
    seller listing (322.8 to 18.6 ohm) and agree with Auber's guide; VDO's own curve table file was not available.
    Check in hot water with a thermometer. 120 ohm reads 77.6 degC.

thresholds:
  # Four levels per item, any of them null (off). alarm = red / flashing, caution = amber. Values are in the display units.
  # Source: AeroVee 2.1 manual (Rev AG, Operating Limitations) for the alarms. The cautions are proposed, not from the manual.
  # The low oil pressure alarm and low oil temperature caution only count with the engine running; until the RPM source is
  # chosen they are held off for 10 s after power-up (the Blaze rule) and nothing more. Alarms are acknowledged with the knob
  # push, a repeat alarm counts as new.
  power_up_inhibit_s: 10
  rpm:          {low_alarm: null, low_caution: null, high_caution: 3800, high_alarm: 4000, note: "manual: max 4000; cruise 3200 +/- 200; idle 800 to 900"}
  oil_pressure: {unit: bar, low_alarm: 0.7, low_caution: 1.4, high_caution: null, high_alarm: null, note: "manual: min 10 psi hot at idle, cruise 40 to 50 psi (2.8 to 3.4 bar), max 100 psi which the 5 bar sender cannot show"}
  oil_temp:     {unit: degC, low_alarm: null, low_caution: null, high_caution: 110, high_alarm: 116, note: "manual: max 240 F; min 160 F (80 F for take-off), which is left off"}
  cht:          {unit: degC, low_alarm: null, low_caution: null, high_caution: 216, high_alarm: 232, note: "manual: cruise 350 to 375 F, climb 420 F for 5 min, max 450 F"}
  egt:          {unit: degC, low_alarm: null, low_caution: null, high_caution: null, high_alarm: 760, note: "manual: max 1400 F. No caution, by decision (2026-10-26): the manual gives none and a 4 digit EGT leaves no room for a caution mark on the Cylinders page"}
  volts:        {unit: V, low_alarm: null, low_caution: null, high_caution: null, high_alarm: null, note: "not in the manual; David to choose (GRT suggests about 14.6 high and 12.4 low with the engine running)"}
  amps:         {unit: A, low_alarm: null, low_caution: null, high_caution: null, high_alarm: null, note: "after the sensor is calibrated"}
  status: fitted

cylinders:
  # AeroVee numbering, viewed from behind the engine: 1 back left, 2 front left, 3 back right, 4 front right (manual, Cylinder Identification).
  # The probe wiring is David's choice; EGT n and CHT n are taken to be on cylinder n (TC1 to TC4 EGT, TC5 to TC8 CHT).
  numbering: {1: back left, 2: front left, 3: back right, 4: front right}
  status: pending

thermocouples:
  from: [tc1, tc2, tc3, tc4, tc5, tc6, tc7, tc8]   # RDAC_TC_1_4 and RDAC_TC_5_8, int16 degC
  formula: "degC = tc + cold_junction_temp (RDAC_SUPPLY bytes 0-1, int16 degC)"
  egt: [tc1, tc2, tc3, tc4]
  cht: [tc5, tc6, tc7, tc8]
  type: K
  unit: degC
  status: checked
  check: "Probes on TC1 and TC5 warmed by hand on 2026-10-25; the Blaze agrees with the mapping"

supply_voltage:
  from: supply_voltage        # RDAC_SUPPLY bytes 2-3
  formula: "volts = raw / 57.3758"
  unit: V
  status: fitted
  note: >
    MGL's table says raw / 5.73758 in 0.1 V steps, which is raw / 57.3758 volts. The baseline raw 685 gives
    11.94 V. Compare with a meter on the supply.

current:
  from: current               # RDAC_RPM_MAP bytes 6-7
  sender: MGL magnetic (closed loop) current sensor, output about 2.5 V at zero current
  formula: "amps = (raw - zero_raw) * amps_per_count"
  zero_raw: null
  amps_per_count: null
  unit: A
  status: pending
  note: >
    Not in the manuals as a number. The Blaze procedure is: zero with no current through the sensor, then adjust the gain
    against a meter in series. Both constants are measured once the sensor is fitted. The input reads 3908 when nothing
    is connected, which is not a current.

rpm:
  from: [rpm1, rpm2]          # RDAC_RPM_MAP bytes 0-1 and 2-3
  formula: "rpm = rpm1 * (1 pulse per revolution / pulses_per_rev); 50000 or more means RPM x 10"
  pulses_per_rev: null
  unit: rpm
  status: pending
  note: "The sender is not chosen (Magnatron P-lead or the Littelfuse Hall geartooth sensor), so the pulses per revolution is unknown."
